<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hatch Isle</title>
<style>
  @font-face { font-family: Nunito; font-weight: 700 900; font-display: swap; src: url(./assets/fonts/nunito-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+2605, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 700 900; font-display: swap; src: url(./assets/fonts/nunito-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {
    --ink: #2a1d17; --wood: #b9773f; --wood2: #a0622f; --wood-d: #6e3f1d; --plank: #c98a4e;
    --paper: #fbefd4; --paper2: #f1dcb0; --cream: #fff8e8; --gold: #ffc93d; --gold-d: #d18f12;
    --leaf: #6cc04a; --leaf-d: #3f8a2c; --sky: #ff8a5c; --red: #e8553f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #9fdcff; font-family: Nunito, "Trebuchet MS", system-ui, sans-serif; touch-action: none; color: var(--cream); }
  canvas#game { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; overflow: visible; }
  .ot { paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 3.5px 0 var(--ink); }

  /* wood: planks with grain lines, nail dots, ink outline, hard drop */
  .wood { background:
      radial-gradient(circle at 9px 9px, #5a3418 2px, transparent 2.6px),
      radial-gradient(circle at calc(100% - 9px) 9px, #5a3418 2px, transparent 2.6px),
      repeating-linear-gradient(176deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px, rgba(90,52,24,.12) 9px 10px, transparent 10px 17px),
      linear-gradient(var(--plank), var(--wood));
    border: 3px solid var(--ink); border-radius: 10px 13px 9px 12px; box-shadow: inset 0 -4px 0 var(--wood2), inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 var(--ink); }

  /* loader */
  #loader { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            background: linear-gradient(#8fd6ff, #d7f1ff 70%, #8ff0e6); }
  #loader .logo { font-size: clamp(46px, 10vw, 92px); font-weight: 900; color: var(--cream); line-height: .9; transform: rotate(-4deg); letter-spacing: 1px; text-align: center;
     text-shadow: 0 5px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 10px 0 var(--ink); }
  #loader .logo b { color: var(--gold); display: block; font-size: .62em; transform: rotate(3deg); }
  #bar { width: min(320px, 74vw); height: 22px; border-radius: 12px; background: #fff3d8; border: 3px solid var(--ink); overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
  #bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--gold) 0 10px, #ffd86a 10px 20px); transition: width .2s; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }

  /* coins plaque */
  #coins { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); padding: 4px 16px 6px 8px; display: flex; align-items: center; gap: 8px; transform: rotate(-1.5deg); }
  #coins .big { font-size: 32px; font-weight: 900; line-height: 1; }
  #coins .rate { font-size: 16px; font-weight: 900; color: #ffe9a8; line-height: 1; }
  #coins .ic { width: 46px; height: 46px; }
  #coins.bump .ic { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.25) rotate(-8deg); } }

  /* top-right round buttons */
  #tr { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: flex-start; }
  .rbtn { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; font-size: 30px; position: relative; color: var(--cream); }
  .rbtn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--wood2), 0 1px 0 var(--ink); }
  #btnBoost { width: auto; border-radius: 30px; padding: 0 14px 0 8px; gap: 4px; display: flex; font-size: 30px; background: linear-gradient(#ffd45a, #ffb21f); box-shadow: inset 0 -4px 0 #d18f12, 0 4px 0 var(--ink); }
  #btnBoost span { font-size: 15px; font-weight: 900; }
  #btnBoost.on { animation: glowp 1.6s ease-in-out infinite; }
  @keyframes glowp { 50% { filter: brightness(1.15); transform: scale(1.04); } }

  /* warmth bar over the egg */
  #warm { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: none; }
  #warm svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(42,29,23,.35)); }
  #warm .nm { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%) rotate(-1.5deg); font-size: 15px; font-weight: 900; padding: 2px 12px 4px; white-space: nowrap; }
  #warmF { transition: stroke-dashoffset .1s; }
  #dim { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(20,10,0,0) 22%, rgba(20,10,0,.55) 75%); opacity: 0; transition: opacity .3s; }
  #dim.on { opacity: 1; }
  #flash { position: fixed; inset: 0; z-index: 6; background: #fffbe8; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  #dex { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) rotate(1deg); display: flex; align-items: center; gap: 8px; padding: 5px 14px 7px 10px; font-size: 30px; }
  #dex .dn { font-size: 20px; font-weight: 900; line-height: 1; }
  #dex .db { width: 84px; height: 10px; margin-top: 4px; background: #4a2a14; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  #dex .db i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .4s; }
  #dex.pop { animation: dexpop .6s cubic-bezier(.3,1.8,.6,1); }
  @keyframes dexpop { 40% { transform: translateX(-50%) scale(1.3) rotate(-3deg); } }
  @media (max-width: 520px) { #dex { top: calc(max(10px, env(safe-area-inset-top)) + 62px); font-size: 24px; } #dex .db { width: 60px; } #dex .dn { font-size: 16px; } }
  .float.small { font-size: 16px; color: #ffe9a0; }

  /* tap hint */
  #hint { position: absolute; left: 0; top: 0; pointer-events: none; transform: translate(-20%, 0); text-align: center; }
  #hint svg { width: 64px; height: 64px; animation: poke .9s ease-in-out infinite; filter: drop-shadow(0 3px 0 rgba(42,29,23,.4)); }
  #hint div { font-size: 24px; font-weight: 900; white-space: nowrap; position: absolute; left: 40px; top: -28px; transform: rotate(-4deg); }
  @keyframes poke { 50% { transform: translate(-6px, -10px) rotate(-8deg); } }

  /* bottom dock */
  #dock { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-end; }
  .tag { width: 106px; padding: 7px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; color: var(--cream); position: relative; font-weight: 900; }
  .tag:nth-child(2n) { transform: rotate(1deg); } .tag:nth-child(2n+1) { transform: rotate(-1deg); }
  .tag:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--wood2), 0 1px 0 var(--ink); }
  .tag .ic { font-size: 44px; height: 46px; display: grid; place-items: center; }
  .tag .nm { font-size: 18px; line-height: 1.05; }
  .tag .cost { font-size: 16px; display: flex; align-items: center; gap: 3px; background: rgba(42,29,23,.35); border-radius: 6px; padding: 0 6px; margin-top: 2px; }
  .tag .lv { position: absolute; top: -10px; right: -6px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font-size: 12px; padding: 0 5px; transform: rotate(6deg); }
  .tag.cant .cost { color: #ffb0a0; }
  .tag.can::after { content: ''; position: absolute; top: -7px; left: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--leaf); border: 2.5px solid var(--ink); animation: ping 1s ease-in-out infinite; }
  @keyframes ping { 50% { transform: scale(1.25); } }
  .tag.green { background: radial-gradient(circle at 9px 9px, #2f6a20 2px, transparent 2.6px), radial-gradient(circle at calc(100% - 9px) 9px, #2f6a20 2px, transparent 2.6px), linear-gradient(#7fd05a, #5bb43c); box-shadow: inset 0 -4px 0 var(--leaf-d), 0 4px 0 var(--ink); }

  /* paper sheets (panels) */
  #veil { position: fixed; inset: 0; background: rgba(30,20,10,.45); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .sheet { position: relative; background: linear-gradient(var(--paper), var(--paper2)); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px 10px 8px 12px; box-shadow: 0 6px 0 var(--ink);
           width: min(560px, 100%); max-height: min(92vh, 640px); display: flex; flex-direction: column; padding: 30px 14px 14px; animation: pop .22s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .sheet .ribbon { position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-1.5deg); padding: 6px 26px 8px; font-size: 22px; font-weight: 900; white-space: nowrap; color: var(--cream); }
  .sheet .x { position: absolute; top: -14px; right: -12px; width: 44px; height: 44px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); box-shadow: inset 0 -3px 0 #a8382a, 0 3px 0 var(--ink); color: var(--cream); font-size: 24px; font-weight: 900; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .sheet .sub { text-align: center; font-size: 14px; font-weight: 700; margin: 0 0 8px; opacity: .8; }
  .scroll { overflow-y: auto; touch-action: pan-y; padding: 4px; }
  .eggrow { display: flex; align-items: center; gap: 12px; padding: 10px; min-height: 76px; border: 2.5px dashed rgba(42,29,23,.35); border-radius: 10px; margin-bottom: 8px; }
  .eggrow.on { border: 3px solid var(--leaf-d); background: rgba(108,192,74,.18); }
  .eggrow.next { border: 3px solid #f4c64d; background: rgba(244,198,77,.16); }
  .eggrow.lock { opacity: .6; }
  .eggrow .eg { width: 50px; height: 62px; flex: none; }
  .eggrow .mid { flex: 1; min-width: 0; }
  .eggrow .nm { font-size: 20px; font-weight: 900; }
  .eggrow .pets { display: flex; gap: 4px; margin-top: 3px; }
  .eggrow .pc { position: relative; width: 44px; height: 44px; border-radius: 8px; border: 2.5px solid var(--ink); background: #fff7e6; }
  .eggrow .pc img { width: 100%; height: 100%; display: block; border-radius: 6px; }
  .eggrow .pc.miss img { filter: brightness(0) opacity(.3); }
  .eggrow .pc b { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 4px; color: #fff; border: 1.5px solid var(--ink); white-space: nowrap; }
  .eggrow .pets { gap: 6px; margin-bottom: 6px; }
  .eggrow .pets img.old, .eggrow .pets .q { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--ink); background: #fff7e6; }
  .eggrow .pets .q { display: grid; place-items: center; font-weight: 900; color: rgba(42,29,23,.4); font-size: 18px; }
  .eggrow .odds { font-size: 13px; font-weight: 800; opacity: .85; margin-top: 4px; }
  .pbtn { border: 3px solid var(--ink); border-radius: 10px; padding: 9px 14px; font-weight: 900; font-size: 18px; color: var(--cream); cursor: pointer; min-width: 92px;
          background: linear-gradient(#7fd05a, #5bb43c); box-shadow: inset 0 -4px 0 var(--leaf-d), 0 4px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .pbtn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--leaf-d), 0 1px 0 var(--ink); }
  .pbtn:disabled { filter: grayscale(.8) brightness(.85); }
  .pbtn.gold { background: linear-gradient(#ffd45a, #ffb21f); box-shadow: inset 0 -4px 0 var(--gold-d), 0 4px 0 var(--ink); }
  .pbtn.flat { background: transparent; color: var(--ink); box-shadow: none; border-style: dashed; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { border: 3px solid var(--ink); border-radius: 10px; background: #fff7e6; text-align: center; padding: 4px 2px 5px; position: relative; }
  .card img { width: 100%; aspect-ratio: 1; display: block; }
  .card .nm { font-size: 12px; font-weight: 900; line-height: 1.1; min-height: 2.2em; display: flex; align-items: center; justify-content: center; }
  .card .st { position: absolute; top: 2px; right: 4px; font-size: 13px; font-weight: 900; color: var(--gold-d); }
  .card.unk img { filter: brightness(0) opacity(.25); }
  .rowh { grid-column: 1 / -1; font-weight: 900; font-size: 15px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }

  /* hatch reveal */
  #reveal { position: fixed; left: 50%; top: max(70px, 12vh); transform: translateX(-50%); z-index: 15; text-align: center; pointer-events: none; }
  #reveal .rib { display: inline-block; padding: 6px 30px 9px; font-size: 30px; font-weight: 900; color: var(--cream); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; animation: drop .4s cubic-bezier(.3,1.7,.6,1); }
  #reveal .tg { display: inline-block; white-space: nowrap; margin-top: 8px; padding: 2px 12px; font-size: 16px; font-weight: 900; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-2deg); }
  #reveal .new { font-size: 18px; font-weight: 900; color: var(--gold); margin-bottom: 4px; animation: drop .3s; }
  @keyframes drop { from { transform: translateY(-40px) scale(.6); opacity: 0; } }

  #toast { position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 120px); transform: translateX(-50%) rotate(-1deg); background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 8px;
           box-shadow: 0 4px 0 var(--ink); padding: 6px 14px; font-weight: 900; font-size: 16px; z-index: 25; pointer-events: none; white-space: nowrap; transition: opacity .3s; }
  .float { position: fixed; z-index: 12; pointer-events: none; font-weight: 900; font-size: 22px; color: #fff3b0; white-space: nowrap; }
  .fly { position: fixed; z-index: 13; width: 26px; height: 26px; pointer-events: none; left: 0; top: 0; }
  .ripple { position: fixed; z-index: 11; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid rgba(255,255,255,.9); pointer-events: none; animation: rip .4s ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }

  .boostbox { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 6px 6px; text-align: center; }
  .boostbox .big { font-size: 64px; }
  .boostbox .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .setrow { display: flex; gap: 10px; justify-content: center; padding: 8px; }

  /* small screens */
  @media (max-width: 520px) {
    .tag { width: 68px; padding: 6px 2px; } .tag .ic { font-size: 32px; height: 34px; } .tag .nm { font-size: 13px; } .tag .cost { font-size: 13px; padding: 0 3px; }
    #dock { gap: 5px; } #coins .big { font-size: 24px; } #coins .ic { width: 38px; height: 38px; } .rbtn { width: 52px; height: 52px; font-size: 28px; }
    #reveal .rib { font-size: 24px; padding: 5px 18px 8px; }
  }
  @media (max-height: 480px) { .tag { padding: 3px 4px; } .tag .ic { font-size: 26px; height: 28px; } #reveal { top: 54px; } }
</style>

<script>window.PLATFORM = "web";</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="loader"><div class="logo ot" id="logo">Hatch<b>Isle</b></div><div id="bar"><i></i></div></div>

<div id="hud" class="hidden">
  <div id="coins" class="wood"><svg class="i ic"><use href="#i-coin"/></svg><div><div class="big ot" id="coinN">0</div><div class="rate ot" id="rateN">+0/s</div></div></div>
  <div id="dex" class="wood hidden"><svg class="i"><use href="#i-paw"/></svg><div><div class="ot dn" id="dexN">0/20</div><div class="db"><i id="dexF"></i></div></div></div>
  <div id="tr">
    <button id="btnBoost" class="rbtn wood"><svg class="i"><use href="#i-sun"/></svg><span class="ot" id="boostT">×2</span></button>
    <button id="btnSet" class="rbtn wood"><svg class="i"><use href="#i-sound"/></svg></button>
  </div>
  <div id="warm"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#876342" stroke-width="7.5" opacity=".85"/><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,248,232,.6)" stroke-width="4"/><circle id="warmF" cx="50" cy="50" r="46" fill="none" stroke="url(#warmG)" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="276.5" transform="rotate(-90 50 50)"/><defs><linearGradient id="warmG" x1="0" x2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient></defs></svg><div class="nm wood ot" id="warmN">Meadow Egg</div></div>
  <div id="hint"><svg viewBox="0 0 64 64"><use href="#i-hand"/></svg><div class="ot" id="hintT">Tap the egg!</div></div>
  <div id="dock">
    <button class="tag wood green" id="tEggs"><div class="ic"><svg class="i"><use href="#i-egg"/></svg></div><div class="nm ot" data-t="eggs">Eggs</div></button>
    <button class="tag wood" id="tTap"><span class="lv">1</span><div class="ic"><svg class="i"><use href="#i-hand"/></svg></div><div class="nm ot" data-t="tap">Tap</div><div class="cost ot"><svg class="i"><use href="#i-coin"/></svg><span>15</span></div></button>
    <button class="tag wood" id="tLamp"><span class="lv">0</span><div class="ic"><svg class="i"><use href="#i-lamp"/></svg></div><div class="nm ot" data-t="lamp">Lamp</div><div class="cost ot"><svg class="i"><use href="#i-coin"/></svg><span>50</span></div></button>
    <button class="tag wood" id="tTreats"><span class="lv">0</span><div class="ic"><svg class="i"><use href="#i-apple"/></svg></div><div class="nm ot" data-t="treats">Treats</div><div class="cost ot"><svg class="i"><use href="#i-coin"/></svg><span>100</span></div></button>
    <button class="tag wood green" id="tBook"><div class="ic"><svg class="i"><use href="#i-paw"/></svg></div><div class="nm ot" data-t="book">Pets</div></button>
  </div>
</div>
<div id="dim"></div>
<div id="flash"></div>
<div id="reveal" class="hidden"></div>
<div id="veil" class="hidden"></div>
<div id="toast" class="hidden"></div>

<!-- hand-drawn icon set: thick ink outlines, flat fills -->
<svg width="0" height="0" style="position:absolute">
  <defs>
